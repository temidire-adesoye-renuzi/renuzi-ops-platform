  /warehouse/grn:
    post:
      tags: [Warehouse]
      operationId: createGrn
      summary: Create a Goods Receipt Note (header + lines, transactional)
      description: |
        GRN number (GRN-BUSINESS-YYYYMMDD-SEQ) is generated server-side.
        receiptStatus is derived from the totals (REJECTED when nothing
        received and rejections exist, PARTIAL when received+rejected is less
        than invoiced, COMPLETE otherwise). Positive receipts become RECEIPT
        stock movements so stock position stays correct.
      x-roles: [WAREHOUSE_STAFF, WAREHOUSE_MANAGER, OPS_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrnCreateRequest' }
      responses:
        '201':
          description: GRN recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'GRN GRN-KETU-20260910-001 recorded' }
                  data:
                    type: object
                    properties:
                      grnKey: { type: integer }
                      grnNumber: { type: string }
                      receiptStatus: { $ref: '#/components/schemas/ReceiptStatus' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
