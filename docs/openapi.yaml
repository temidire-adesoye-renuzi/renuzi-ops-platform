        '500':
          $ref: '#/components/responses/InternalError'
  /sync/conflicts/{conflictKey}/resolve:
    put:
      tags: [Sync]
      operationId: resolveSyncConflict
      summary: Resolve a conflict and re-apply the winner
      description: |
        SERVER_WINS keeps the server state (client payload discarded);
        CLIENT_WINS re-applies the parked client payload through the same
        processor with guards overridden; MERGED applies the client payload
        overlaid with mergedPayload (required for MERGED). A merge that still
        violates a hard invariant is rejected with 409.
      x-roles: [OPS_MANAGER, ADMIN, FLEET_MANAGER, WAREHOUSE_MANAGER]
      parameters:
        - name: conflictKey
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConflictResolveRequest' }
      responses:
        '200':
          description: Resolution applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      conflictKey: { type: integer }
                      resolution: { $ref: '#/components/schemas/ConflictResolution' }
                      applied:
                        type: string
                        enum: [SERVER_KEPT, CLIENT_APPLIED, MERGE_APPLIED]
                      entityKey: { type: integer, nullable: true }
        '400':
          description: Invalid resolution, or mergedPayload missing for MERGED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict already resolved, or the resolved version still violates a hard invariant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
