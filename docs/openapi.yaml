      description: |
        Each row carries BOTH the server version and the client version so the
        mobile app / web UI can render a reconciliation screen.
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
