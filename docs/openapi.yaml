  /fleet/maintenance/{maintenanceKey}/approve:
    put:
      tags: [Fleet]
      operationId: approveMaintenance
      summary: Approve a maintenance ticket (OPS or MD level)
      description: |
        Two-level approval. OPS approves from PENDING (ticket becomes
        OPS_APPROVED when above the MD threshold, MD_APPROVED otherwise).
        MD approves from OPS_APPROVED but only when the ticket is above the
        threshold. Ordering violations return 409.
      x-roles: [FLEET_MANAGER, OPS_MANAGER, ADMIN]
      parameters:
        - name: maintenanceKey
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalLevel]
              properties:
                approvalLevel:
                  type: string
                  enum: [OPS, MD]
      responses:
        '200':
          description: Approval recorded (message states whether MD approval is still required)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
        '400':
          description: approvalLevel must be OPS or MD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already decided, MD without prior OPS approval, or ticket within OPS threshold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/maintenance/{maintenanceKey}/status:
    put:
      tags: [Fleet]
      operationId: updateMaintenanceStatus
      summary: Update maintenance workflow status
      description: |
        Work can only progress to IN_PROGRESS or COMPLETED once the ticket is
        at least OPS_APPROVED (409 otherwise). Setting IN_PROGRESS/COMPLETED
        stamps work_start_date/work_completion_date automatically.
      x-roles: [FLEET_MANAGER, OPS_MANAGER, ADMIN]
      parameters:
        - name: maintenanceKey
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceStatusRequest' }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Maintenance marked COMPLETED' }
        '400':
          description: Invalid maintenanceStatus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ticket must be approved before work can progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
