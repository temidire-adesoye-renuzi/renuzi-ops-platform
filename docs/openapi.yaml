    put:
      tags: [Warehouse]
      operationId: stampSecurityCustody
      summary: Security custody stamp (requires warehouse stamp)
      x-roles: [SECURITY, WAREHOUSE_MANAGER, OPS_MANAGER, ADMIN]
      parameters:
        - name: dispatchKey
          in: path
          required: true
