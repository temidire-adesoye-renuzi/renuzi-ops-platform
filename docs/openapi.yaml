    post:
      tags: [Sync]
      operationId: requeueSyncRow
      summary: Reset a FAILED / DEAD_LETTER queue row to PENDING
      description: Admin escape hatch after the underlying failure cause was fixed.
      x-roles: [OPS_MANAGER, ADMIN, FLEET_MANAGER, WAREHOUSE_MANAGER]
