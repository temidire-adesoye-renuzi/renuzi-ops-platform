openapi: 3.0.3
info:
  title: Renuzi Operations Platform API
  version: 2.0.0
  description: |
    Fleet and warehouse field-operations API for the Renuzi Operations Platform
    (Node.js + Express + SQL Server 2022, offline-first mobile clients).

    ## Conventions

    **Base URL:** all paths are relative to `/api` (e.g. `http://localhost:3000/api`).

    **Response envelope** — every endpoint (except `GET /health`, `GET /ready` and
    `GET /uploads/content/{token}`) responds with:

    ```json
    { "success": true, "message": "human-readable text", "data": {}, "count": 0 }
    ```

    `data` is the payload (object or array), `count` is the array length when `data`
    is an array. Errors use `success: false` + `message`; in development an `error`
    field (stack trace) is added — it never appears in production.

    **Authentication** — `Authorization: Bearer <JWT>` on every endpoint except
    `POST /auth/login`, `GET /health`, `GET /ready` and `GET /uploads/content/{token}`
    (the HMAC token in that path is itself the credential). Tokens are issued by
    login, signed with `JWT_SECRET`, default expiry 24h. The token is re-checked
    against the database on every request, so deactivated users lose access
    immediately. When the user's `must_change_password` flag is set, every
    authenticated endpoint except `POST /auth/change-password` returns 403 with
    machine-readable code `PASSWORD_ROTATION_REQUIRED`.

    **Roles** — DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF,
    OPS_MANAGER, SECURITY, ADMIN. Each operation lists its *effective* allowed
    role set in the `x-roles` extension (the middleware widens nominal roles —
    e.g. "driver" endpoints also allow FLEET_MANAGER and ADMIN; the documented
    set is what the server actually enforces).

    **Multi-tenancy** — every query is scoped by the business_key carried in the
    JWT; no endpoint accepts a business key from the client.

    **Rate limits** — global: 300 requests / 5 min / IP across /api; login:
    10 attempts / 5 min / IP+userId pair. Exceeding either returns 429 with
    draft-7 RateLimit-* headers.

    **Offline sync contract** — offline writes are pushed via POST /sync/batch
    (idempotent by clientRef) and downloads pulled via POST /pull (cursor-based
    deltas with DELETE tombstones). Reconnect choreography: drain push queue,
    probe GET /pull/meta, page POST /pull until hasMore=false, applying each page
    with the version guard.

    **Soft deletes** — rows are deactivated (is_active=0) and delivered downstream
    as DELETE tombstones in the change log; clients drop the row.
servers:
  - url: 'http://localhost:3000/api'
    description: Local development
  - url: '{protocol}://{host}:{port}/api'
    description: Configurable deployment (Docker / staging)
    variables:
      protocol:
        enum: [http, https]
        default: http
      host:
        default: localhost
      port:
        default: '3000'
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes (no authentication).
  - name: Auth
    description: Login, registration, profile and password management.
  - name: Fleet
    description: Vehicles, checks, trips, fuel and maintenance (driver + fleet manager flows).
  - name: Warehouse
    description: GRNs, dispatches with custody chain, stock movements, counts, returns, stock position.
  - name: Sync
    description: Offline push queue - idempotent batch push, status, conflicts, requeue.
  - name: Pull
    description: Offline pull - change-log deltas and snapshots with cursor paging.
  - name: Dashboard
    description: Read-only, business-scoped aggregations for the ops web dashboard.
  - name: Uploads
    description: File upload with signed, time-limited retrieval URLs.
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Liveness probe (process up, no DB check)
      security: []
      x-roles: []
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: OK }
                  message: { type: string }
                  timestamp: { type: string, format: date-time }
                  version: { type: string, example: 2.0.0 }
  /ready:
    get:
      tags: [Health]
      operationId: readinessCheck
      summary: Readiness probe (pings the database)
      security: []
      x-roles: []
      responses:
        '200':
          description: Database reachable, service ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: READY }
                  db: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: NOT_READY }
                  db: { type: string, example: unreachable }
                  timestamp: { type: string, format: date-time }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and obtain a JWT
      description: |
        Brute-force limited to 10 attempts / 5 min per IP+userId pair (429 when
        exceeded). Unknown user and wrong password both return the same
        401 "Invalid credentials" (no user enumeration, timing-equalised).
      security: []
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful; JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Login successful }
                  data: { $ref: '#/components/schemas/LoginData' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account deactivated, business inactive, or driver license expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Create a new user (admin only)
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'User DRV-002 created successfully' }
        '400':
          description: Missing fields, invalid role, or businessKey not an active business
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: userId already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user profile with business info
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      responses:
        '200':
          description: Profile (snake_case columns as stored)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/UserProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change own password
      description: |
        The only endpoint allowed while the must_change_password flag is set
        (everything else returns 403 PASSWORD_ROTATION_REQUIRED). A successful
        change clears the rotation flag.
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed; rotation flag cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Password changed successfully' }
                  data:
                    type: object
                    properties:
                      rotationCleared: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing Authorization header, or currentPassword incorrect (an invalid/expired token returns 403)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/vehicles:
    get:
      tags: [Fleet]
      operationId: listVehicles
      summary: List all vehicles for the caller's business
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      responses:
        '200':
          description: Vehicles (ordered by vehicle_id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/vehicles/{vehicleKey}:
    get:
      tags: [Fleet]
      operationId: getVehicle
      summary: Vehicle detail
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      parameters:
        - $ref: '#/components/parameters/VehicleKey'
      responses:
        '200':
          description: Vehicle detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Vehicle' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/vehicles/{vehicleKey}/odometer:
    put:
      tags: [Fleet]
      operationId: updateVehicleOdometer
      summary: Update odometer reading (monotonicity enforced)
      description: |
        The new reading may never be below the vehicle's current odometer -
        a regression returns 409. The update and its VEHICLES change-log row
        commit in one transaction.
      x-roles: [DRIVER, FLEET_MANAGER, ADMIN]
      parameters:
        - $ref: '#/components/parameters/VehicleKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OdometerUpdateRequest' }
      responses:
        '200':
          description: Odometer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Odometer updated' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Odometer reading below the vehicle's current odometer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/checks:
    post:
      tags: [Fleet]
      operationId: submitVehicleCheck
      summary: Submit a vehicle daily check
      description: |
        The overall checkStatus is computed server-side: PASS when all 11
        checklist items pass, PASS_WITH_ISSUES when any damage is reported,
        FAIL otherwise. A client-supplied checkStatus is ignored.
      x-roles: [DRIVER, FLEET_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCheckRequest' }
      responses:
        '201':
          description: Check recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Vehicle check recorded' }
                  data:
                    type: object
                    properties:
                      checkKey: { type: integer }
                      checkStatus: { $ref: '#/components/schemas/CheckStatus' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Fleet]
      operationId: listVehicleChecks
      summary: List vehicle checks (fleet manager view)
      x-roles: [FLEET_MANAGER, OPS_MANAGER, ADMIN]
      parameters:
        - name: vehicleKey
          in: query
          description: Filter by vehicle
          schema: { type: integer }
        - name: status
          in: query
          description: Filter by check status
          schema: { $ref: '#/components/schemas/CheckStatus' }
        - name: dateFrom
          in: query
          description: 'check_datetime >= dateFrom'
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          description: 'check_datetime <= dateTo'
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Checks (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleCheck' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/trips/start:
    post:
      tags: [Fleet]
      operationId: startTrip
      summary: Start a trip
      description: |
        Transactional: inserts the trip and flips the vehicle to ON_ROUTE.
        409 when the start odometer is below the vehicle's current odometer or
        the vehicle already has an active trip.
      x-roles: [DRIVER, FLEET_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripStartRequest' }
      responses:
        '201':
          description: Trip started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Trip started' }
                  data:
                    type: object
                    properties:
                      tripKey: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Odometer regression or active-trip collision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/trips/{tripKey}/end:
    post:
      tags: [Fleet]
      operationId: endTrip
      summary: End a trip
      description: |
        Idempotent: ending an already-COMPLETED or CANCELLED trip is a no-op
        ack (alreadyEnded true). Distance is computed as endOdometer minus
        start_odometer; the vehicle returns to ACTIVE (guarded odometer
        update) and both updates commit transactionally.
      x-roles: [DRIVER, FLEET_MANAGER, ADMIN]
      parameters:
        - name: tripKey
          in: path
          required: true
          description: Numeric key of the trip (fact_trip.trip_key)
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripEndRequest' }
      responses:
        '200':
          description: Trip completed (or already-ended ack)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Trip completed' }
                  data:
                    type: object
                    properties:
                      tripKey: { type: integer }
                      distanceKm: { type: number, nullable: true }
                      alreadyEnded: { type: boolean, example: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: endOdometer below the trip's start odometer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/trips:
    get:
      tags: [Fleet]
      operationId: listTrips
      summary: List trips
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      parameters:
        - name: vehicleKey
          in: query
          schema: { type: integer }
        - name: driverKey
          in: query
          schema: { type: integer }
        - name: status
          in: query
          description: Trip status filter
          schema: { $ref: '#/components/schemas/TripStatus' }
        - name: dateFrom
          in: query
          description: 'trip_start_time >= dateFrom'
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          description: 'trip_start_time <= dateTo'
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Trips (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trip' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/fuel-requests:
    post:
      tags: [Fleet]
      operationId: createFuelRequest
      summary: Request fuel (driver)
      x-roles: [DRIVER, FLEET_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuelRequestCreateRequest' }
      responses:
        '201':
          description: Fuel request submitted (status PENDING)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Fuel request submitted' }
                  data:
                    type: object
                    properties:
                      fuelRequestKey: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Fleet]
      operationId: listFuelRequests
      summary: List fuel requests (fleet manager view)
      x-roles: [FLEET_MANAGER, OPS_MANAGER, ADMIN]
      parameters:
        - name: status
          in: query
          description: Approval status filter
          schema: { $ref: '#/components/schemas/FuelRequestStatus' }
        - name: vehicleKey
          in: query
          schema: { type: integer }
        - name: dateFrom
          in: query
          description: 'request_datetime >= dateFrom'
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          description: 'request_datetime <= dateTo'
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Fuel requests (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FuelRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/fuel-requests/{fuelRequestKey}/approve:
    put:
      tags: [Fleet]
      operationId: decideFuelRequest
      summary: Approve or reject a fuel request
      description: Only PENDING requests can be decided; a second decision returns 409.
      x-roles: [FLEET_MANAGER, OPS_MANAGER, ADMIN]
      parameters:
        - name: fuelRequestKey
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuelApproveRequest' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Fuel request approved' }
        '400':
          description: approvalStatus must be APPROVED or REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Fuel request already decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/fuel-logs:
    post:
      tags: [Fleet]
      operationId: recordFuelLog
      summary: Log an actual refuelling (driver)
      description: |
        409 when the odometer reading is below the vehicle's current odometer.
        kmSinceLast and litersPer100km are computed server-side; the vehicle
        odometer is advanced (guarded) in the same transaction.
      x-roles: [DRIVER, FLEET_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuelLogRequest' }
      responses:
        '201':
          description: Fuel log recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Fuel log recorded' }
                  data:
                    type: object
                    properties:
                      fuelLogKey: { type: integer }
                      kmSinceLast: { type: number, nullable: true }
                      litersPer100km: { type: number, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Odometer regression
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /fleet/maintenance:
    post:
      tags: [Fleet]
      operationId: reportMaintenance
      summary: Raise a maintenance ticket
      description: |
        When estimatedCost exceeds the MAINTENANCE_MD_THRESHOLD app config
        (default 100000), the ticket enters PENDING and needs OPS then MD
        approval; otherwise it is born OPS_APPROVED.
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceCreateRequest' }
      responses:
        '201':
