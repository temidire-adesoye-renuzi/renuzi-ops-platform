          schema: { type: string, example: 'VEHICLES,ROUTES' }
      responses:
        '200':
          description: Map of dataset name to maxChangeKey/totalChanges
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        maxChangeKey: { type: integer }
                        totalChanges: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /pull:
    post:
      tags: [Pull]
      operationId: pullChanges
      summary: Paged delta pull (cursor-based, resumable)
      description: |
        Per-dataset cursor: { DATASET: lastAppliedChangeKey }. Cursor 0 (or
        absent) means full snapshot of current state, keyset-paged - while a
        snapshot has more pages the response carries snapshotAfterKey (last
        entityKey of the page); echo it back unchanged on the next call with
        the cursor still 0 to resume. Deletes arrive as DELETE tombstones
        with payload null - clients drop the row. Stale cursors (older than
        the retention sweep) return resetRequired listing the datasets to
        re-bootstrap with cursor 0. hasMore true means another page is
        pending for at least one dataset.
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PullRequest' }
      responses:
        '200':
          description: One page of changes plus continuation cursors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      changes:
                        type: array
                        items: { $ref: '#/components/schemas/ChangeRow' }
                      nextCursor:
                        type: object
                        description: Map of dataset to its new watermark
                        additionalProperties: { type: integer }
                      hasMore: { type: boolean }
                      snapshotAfterKey:
                        type: object
                        description: Present while a cursor-0 snapshot still has pages
                        additionalProperties: { type: integer }
                      resetRequired:
                        type: array
                        description: Datasets whose cursor went stale (re-bootstrap with cursor 0)
                        items: { type: string }
        '400':
          description: cursor/snapshotAfterKey not an object, unknown dataset, or negative key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
