        + magic-byte sniffing (extension lies are caught, 415), 10 MB cap
        (413), optional ClamAV scan (fails closed - a configured but
        unreachable scanner rejects the upload with 503; a detected virus
        returns 422). The returned url is the value stored in damage_photo_url
        / receipt_photo_url / signature fields; clients re-fetch via
        GET /uploads/content/{token} when it expires (default TTL 900s).
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      parameters:
        - name: purpose
          in: query
          required: false
          description: Defaults to GENERAL
          schema: { $ref: '#/components/schemas/UploadPurpose' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpeg / png / webp / pdf, max 10 MB
      responses:
        '201':
          description: File stored; signed URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'File stored' }
                  data: { $ref: '#/components/schemas/UploadStored' }
        '400':
          description: Empty file or invalid purpose
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          description: Content does not match any allowed type (magic-byte check)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: File failed virus scanning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Virus scanning temporarily unavailable (fails closed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /uploads/content/{token}:
    get:
      tags: [Uploads]
      operationId: downloadUploadContent
      summary: Stream a stored file via its signed token
      description: |
        No Authorization header - the HMAC-SHA256 token in the path is itself
        the credential (lets mobile webviews and native photo viewers fetch
        without header injection). 404 when expired or invalid. Responses
        carry Cache-Control private max-age=300 and Content-Disposition inline.
      security: []
      x-roles: []
      parameters:
        - name: token
          in: path
          required: true
          description: Signed token from the upload response url
          schema: { type: string }
      responses:
        '200':
          description: File bytes (Content-Type matches the sniffed type)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Link expired or invalid, or file missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by POST /auth/login (default expiry 24h). Send as
        Authorization Bearer token. Re-validated against the database on every
        request; deactivated users are rejected immediately.
  parameters:
    VehicleKey:
      name: vehicleKey
      in: path
      required: true
      description: Numeric key of the vehicle (dim_vehicle.vehicle_key)
      schema: { type: integer }
  responses:
    BadRequest:
      description: Validation failure (message names the field)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing Authorization header (or bad credentials on login). Invalid or expired tokens return 403, not 401.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Wrong role, invalid/expired token, deactivated account, or PASSWORD_ROTATION_REQUIRED (see code)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found (or endpoint)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: State conflict (duplicate decision, broken custody chain, odometer regression)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Upload or JSON body too large (10 MB caps)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests (global 300/5min/IP or login 10/5min/IP+userId)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Generic internal error - no stack/message leaks in production
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code:
          type: string
          description: Machine-readable code, e.g. PASSWORD_ROTATION_REQUIRED
        error:
          type: string
          description: Stack trace - DEVELOPMENT ONLY, never in production
    LoginRequest:
      type: object
      required: [userId, password]
      properties:
        userId: { type: string, example: DRV-001 }
        password: { type: string, format: password }
        deviceId: { type: string, description: Optional mobile device identifier for logging }
    LoginData:
      type: object
      properties:
        token: { type: string, description: JWT bearer token (24h default expiry) }
        user:
          type: object
          properties:
            userKey: { type: integer }
            userId: { type: string, example: DRV-001 }
            fullName: { type: string }
            email: { type: string, nullable: true }
            role: { $ref: '#/components/schemas/UserRole' }
            department: { type: string }
            businessKey: { type: integer }
            businessName: { type: string }
            businessId: { type: string, example: KD-KETU }
            licenseWarning: { type: string, nullable: true, description: Populated for drivers with <= 30 days to license expiry }
            mustChangePassword: { type: boolean }
    RegisterRequest:
      type: object
      required: [userId, fullName, role, department, businessKey, password]
      properties:
        userId: { type: string, example: DRV-002 }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        department:
          type: string
          enum: [FLEET, WAREHOUSE, OPERATIONS, FINANCE]
        businessKey: { type: integer, description: Must reference an active business }
        password: { type: string, format: password }
        licenseNumber: { type: string, description: Drivers only }
        licenseExpiry: { type: string, format: date, description: Drivers only }
    UserProfile:
      type: object
      description: Snake_case columns as returned by the database
      properties:
        user_key: { type: integer }
        user_id: { type: string }
        full_name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/UserRole' }
        department: { type: string }
        license_number: { type: string, nullable: true }
        license_expiry: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        business_name: { type: string }
        business_id: { type: string }
        region: { type: string, nullable: true }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword:
          type: string
          format: password
          minLength: 6
    OdometerUpdateRequest:
      type: object
      required: [odometerReading]
      properties:
        odometerReading:
          type: number
          minimum: 0
          description: Must be >= the vehicle's current reading (409 otherwise)
    VehicleCheckRequest:
      type: object
      required: [vehicleKey]
      properties:
        vehicleKey: { type: integer }
        mobileDeviceId: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        tiresOk: { type: boolean }
        lightsOk: { type: boolean }
        brakesOk: { type: boolean }
        engineOk: { type: boolean }
        oilLevelOk: { type: boolean }
        coolantOk: { type: boolean }
        wipersOk: { type: boolean }
        mirrorsOk: { type: boolean }
        seatbeltsOk: { type: boolean }
        fireExtinguisherOk: { type: boolean }
        firstAidKitOk: { type: boolean }
        hasDamage: { type: boolean, description: Forces PASS_WITH_ISSUES when true }
        damageDescription: { type: string }
        damagePhotoUrl: { type: string, description: Signed URL from POST /uploads (purpose DAMAGE_PHOTO) }
        checkTime: { type: string, format: date-time, description: Reserved; server stamps GETDATE() }
    TripStartRequest:
      type: object
      required: [vehicleKey, startOdometer]
      properties:
        vehicleKey: { type: integer }
        routeKey: { type: integer }
        startTime: { type: string, format: date-time, description: Defaults to now }
        startOdometer: { type: number, description: Must be >= vehicle's current odometer }
        latitude: { type: number }
        longitude: { type: number }
        driverNotes: { type: string }
        mobileDeviceId: { type: string }
    TripEndRequest:
      type: object
      required: [endOdometer]
      properties:
        endOdometer: { type: number, description: Must be >= the trip's start odometer }
        endTime: { type: string, format: date-time, description: Defaults to now }
        latitude: { type: number }
        longitude: { type: number }
        storesVisited: { type: integer }
        deliverySuccessCount: { type: integer }
        deliveryFailCount: { type: integer }
        driverNotes: { type: string }
        mobileDeviceId: { type: string }
    FuelRequestCreateRequest:
      type: object
      required: [vehicleKey, amountRequested]
      properties:
        vehicleKey: { type: integer }
        requestType: { $ref: '#/components/schemas/FuelRequestType' }
        amountRequested: { type: number }
        litersRequested: { type: number }
        reason: { type: string }
        mobileDeviceId: { type: string }
    FuelApproveRequest:
      type: object
      required: [approvalStatus]
      properties:
        approvalStatus: { $ref: '#/components/schemas/FuelDecisionStatus' }
        approvalNotes: { type: string }
        disbursedAmount: { type: number, description: Recorded only on APPROVED }
    FuelLogRequest:
      type: object
      required: [vehicleKey, odometerReading, litersFilled]
      properties:
        vehicleKey: { type: integer }
        fuelRequestKey: { type: integer }
        odometerReading: { type: number, description: Must be >= vehicle's current odometer }
        litersFilled: { type: number }
        costPerLiter: { type: number }
        totalCost: { type: number }
        stationName: { type: string }
        receiptPhotoUrl: { type: string, description: Signed URL from POST /uploads (purpose RECEIPT_PHOTO) }
        mobileDeviceId: { type: string }
    MaintenanceCreateRequest:
      type: object
      required: [vehicleKey, maintenanceType, description]
      properties:
        vehicleKey: { type: integer }
        maintenanceType: { $ref: '#/components/schemas/MaintenanceType' }
        priority: { $ref: '#/components/schemas/Priority' }
        description: { type: string }
        estimatedCost: { type: number, description: Above MAINTENANCE_MD_THRESHOLD (default 100000) triggers the MD approval flow }
        mobileDeviceId: { type: string }
    MaintenanceStatusRequest:
      type: object
      required: [maintenanceStatus]
      properties:
        maintenanceStatus: { $ref: '#/components/schemas/MaintenanceStatus' }
        completionNotes: { type: string }
        actualCost: { type: number }
        vendorName: { type: string }
        invoiceNumber: { type: string }
    GrnCreateRequest:
      type: object
      required: [lines]
      properties:
        mobileDeviceId: { type: string }
        supplierKey: { type: integer, description: Global supplier; validated when present }
        waybillNumber: { type: string }
        invoiceNumber: { type: string }
        truckPlateNumber: { type: string }
        driverName: { type: string }
        sealNumber: { type: string }
        sealIntact: { type: boolean }
        totalInvoiceQty: { type: integer, description: Defaults to the sum over lines }
        totalReceivedQty: { type: integer, description: Defaults to the sum over lines }
        totalRejectedQty: { type: integer, description: Defaults to the sum over lines }
        rejectionReason: { type: string }
        lines:
          type: array
          minItems: 1
          description: At least one line required
          items:
            type: object
            required: [productKey]
            properties:
              productKey: { type: integer, description: Must belong to the caller's business }
              invoiceQty: { type: integer, minimum: 0, default: 0 }
              receivedQty: { type: integer, minimum: 0, default: 0 }
              rejectedQty: { type: integer, minimum: 0, default: 0 }
              productionDate: { type: string, format: date }
              expiryDate: { type: string, format: date }
              batchNumber: { type: string }
              isDamaged: { type: boolean }
              isExpired: { type: boolean }
              isNearExpiry: { type: boolean }
              nearExpiryDays: { type: integer }
              rejectionReason: { type: string }
              allocatedLocation: { type: string, description: e.g. MAIN; drives the stock movement location }
              fifoCompliant: { type: boolean }
    DispatchCreateRequest:
      type: object
      required: [customerKey, invoiceNumber, lines]
      properties:
        mobileDeviceId: { type: string }
        customerKey: { type: integer, description: Must belong to the caller's business }
        invoiceNumber: { type: string }
        driverKey: { type: integer, description: Optional; validated against the business when present }
        vehicleKey: { type: integer, description: Optional; validated against the business when present }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productKey]
            properties:
              productKey: { type: integer }
              invoiceQty: { type: integer, default: 0 }
              pickedQty: { type: integer, default: 0 }
              loadedQty: { type: integer, default: 0 }
              unitPrice: { type: number }
    CustomerAckRequest:
      type: object
      properties:
        mobileDeviceId: { type: string }
        customerSignatureUrl:
          type: string
          description: Signed URL from POST /uploads (purpose CUSTOMER_SIGNATURE)
        returned:
          type: boolean
          description: True marks the dispatch RETURNED instead of DELIVERED
        returnReason: { type: string, description: Required in effect when returned is true }
        lineDeliveries:
          type: array
          description: Optional per-line delivered/returned quantities
          items:
            type: object
            required: [lineKey]
            properties:
              lineKey: { type: integer, description: fact_dispatch_line.dispatch_line_key }
              deliveredQty: { type: integer, default: 0 }
              returnedQty: { type: integer, default: 0 }
    ManualMovementRequest:
      type: object
      required: [productKey, movementType, quantity]
      properties:
        mobileDeviceId: { type: string }
        productKey: { type: integer }
        movementType: { $ref: '#/components/schemas/ManualMovementType' }
        quantity: { type: integer, exclusiveMinimum: 0 }
        warehouseLocation: { type: string, default: MAIN }
        toBusinessKey: { type: integer, description: Required for TRANSFER_OUT }
        fromWarehouse: { type: string }
        toWarehouse: { type: string }
        unitCost: { type: number, description: total_value is computed as unitCost x quantity }
        notes: { type: string }
    StockCountRequest:
      type: object
      required: [productKey, systemQty, physicalCount]
      properties:
        mobileDeviceId: { type: string }
        productKey: { type: integer }
        warehouseLocation: { type: string, default: MAIN }
        systemQty: { type: integer }
        physicalCount: { type: integer }
        witnessedByKey: { type: integer }
        varianceReason: { type: string, description: Defaults to Unexplained when variance != 0 }
    GoodsReturnRequest:
      type: object
      required: [customerKey, productKey, returnType, quantityReturned]
      properties:
        mobileDeviceId: { type: string }
        customerKey: { type: integer }
        productKey: { type: integer }
        returnType: { $ref: '#/components/schemas/ReturnType' }
        originalInvoice: { type: string }
        batchNumber: { type: string }
        quantityReturned: { type: integer, exclusiveMinimum: 0 }
        creditNoteRequested: { type: boolean }
    SyncBatchRequest:
      type: object
      required: [deviceId, items]
      properties:
        deviceId: { type: string }
        items:
          type: array
          minItems: 1
          description: Server enforces a configurable cap (SYNC_BATCH_SIZE app config, default 50); larger batches return 400
          items:
            type: object
            required: [clientRef, entityType, payload]
            properties:
              clientRef:
                type: string
                maxLength: 100
                description: Client-generated unique reference - the idempotency key
              entityType: { $ref: '#/components/schemas/SyncEntityType' }
              payload:
                type: object
                description: |
                  Entity-specific payload, same shape as the corresponding
                  online request body (oneOf below). DISPATCH_ACK additionally
                  requires stage (WAREHOUSE | SECURITY | DRIVER | CUSTOMER) and
                  dispatchKey. Unknown extra key clientRef is merged in by the
                  server on enqueue.
                oneOf:
                  - $ref: '#/components/schemas/VehicleCheckRequest'
                  - $ref: '#/components/schemas/TripStartRequest'
                  - $ref: '#/components/schemas/TripEndRequest'
                  - $ref: '#/components/schemas/FuelRequestCreateRequest'
                  - $ref: '#/components/schemas/FuelLogRequest'
                  - $ref: '#/components/schemas/MaintenanceCreateRequest'
                  - $ref: '#/components/schemas/GrnCreateRequest'
                  - $ref: '#/components/schemas/CustomerAckRequest'
                  - $ref: '#/components/schemas/StockCountRequest'
                  - $ref: '#/components/schemas/ManualMovementRequest'
                  - $ref: '#/components/schemas/GoodsReturnRequest'
                  - $ref: '#/components/schemas/DispatchAckPayload'
    DispatchAckPayload:
      type: object
      required: [dispatchKey, stage]
      description: SYNC entity DISPATCH_ACK - custody-chain stamping from the mobile app
      properties:
        dispatchKey: { type: integer }
        stage:
          type: string
          enum: [WAREHOUSE, SECURITY, DRIVER, CUSTOMER]
        loadedQuantities:
          type: array
          items:
            type: object
            properties:
              lineKey: { type: integer }
              loadedQty: { type: integer }
        driverSignatureUrl: { type: string }
        customerSignatureUrl: { type: string }
        returned: { type: boolean }
        returnReason: { type: string }
        lineDeliveries:
          type: array
          items:
            type: object
            properties:
              lineKey: { type: integer }
              deliveredQty: { type: integer }
              returnedQty: { type: integer }
        mobileDeviceId: { type: string }
    SyncItemResult:
      type: object
      properties:
        clientRef: { type: string, nullable: true }
        queueId: { type: integer, nullable: true, description: Set for QUEUED / DUPLICATE_ACK / ALREADY_QUEUED }
        status:
          type: string
          enum: [QUEUED, DUPLICATE_ACK, ALREADY_QUEUED, REJECTED]
        message:
          type: string
          nullable: true
          description: Populated for DUPLICATE_ACK ("Item already received") and REJECTED (reason)
    ProcessingSummary:
      type: object
      properties:
        processed: { type: integer }
        synced: { type: integer }
        failed: { type: integer }
        conflicts: { type: integer }
        deadLettered: { type: integer }
        reclaimed: { type: integer }
    QueueStatusRow:
      type: object
      properties:
        device_id: { type: string }
        total_queued: { type: integer }
        pending: { type: integer }
        processing: { type: integer }
        synced: { type: integer }
        failed: { type: integer }
        conflict: { type: integer }
        dead_letter: { type: integer }
        last_push_at: { type: string, format: date-time, nullable: true }
        last_processed_at: { type: string, format: date-time, nullable: true }
    ConflictRow:
      type: object
      description: Both versions exposed for a reconciliation screen
      properties:
        conflict_key: { type: integer }
        queue_id: { type: integer }
        entity_type: { type: string }
        entity_key: { type: integer, nullable: true }
        server_version_json: { type: string, nullable: true, description: JSON-encoded server version }
        client_version_json: { type: string, nullable: true, description: JSON-encoded client version }
        resolution: { type: string, example: PENDING }
        created_at: { type: string, format: date-time }
        device_id: { type: string }
        retry_count: { type: integer }
        queued_at: { type: string, format: date-time }
    ConflictResolveRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { $ref: '#/components/schemas/ConflictResolution' }
        mergedPayload:
          type: object
          description: Required for MERGED - overlaid onto the client payload before re-apply
        resolutionNotes: { type: string }
    PullRequest:
      type: object
      properties:
        cursor:
          type: object
          description: 'Map of dataset to last applied changeKey; 0 or absent = full snapshot'
          additionalProperties: { type: integer, minimum: 0 }
        pageSize:
          type: integer
          description: Clamped to 1..max(SYNC_PULL_PAGE_SIZE default 200, 200)
        datasets:
          type: array
          items: { $ref: '#/components/schemas/PullDataset' }
        snapshotAfterKey:
          type: object
          description: Echo-back value from the previous snapshot page (last entityKey per dataset)
          additionalProperties: { type: integer, minimum: 0 }
    ChangeRow:
      type: object
      properties:
        entityType: { $ref: '#/components/schemas/PullDataset' }
        entityKey: { type: integer }
        op:
          type: string
          enum: [UPSERT, DELETE]
          description: DELETE = tombstone, payload is null - clients drop the row
        versionNo: { type: integer }
        changeKey: { type: integer }
        payload:
          type: object
          nullable: true
          description: Full row snapshot; null for DELETE tombstones
    UploadStored:
      type: object
      properties:
        storageKey:
          type: string
          description: 'Opaque path: businessKey/purpose/uuid.ext'
        url:
          type: string
          description: Signed retrieval URL (GET /uploads/content/{token}), default TTL 900s
        expiresAt: { type: string, format: date-time }
        mime: { type: string, example: image/jpeg }
        bytes: { type: integer }
    Vehicle:
      type: object
      description: Snake_case columns from dim_vehicle
      properties:
        vehicle_key: { type: integer }
        vehicle_id: { type: string, example: VAN-001 }
        business_key: { type: integer }
        plate_number: { type: string }
        make: { type: string, nullable: true }
        model: { type: string, nullable: true }
        year_manufactured: { type: integer, nullable: true }
        capacity_kg: { type: number, nullable: true }
        fuel_type: { type: string, example: PETROL }
        assigned_driver_key: { type: integer, nullable: true }
        assigned_driver_name: { type: string, nullable: true }
        current_odometer: { type: number }
        status: { $ref: '#/components/schemas/VehicleStatus' }
        registration_expiry: { type: string, format: date, nullable: true }
        insurance_expiry: { type: string, format: date, nullable: true }
        last_service_date: { type: string, format: date, nullable: true }
        next_service_due: { type: string, format: date, nullable: true }
        is_active: { type: integer, enum: [0, 1] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VehicleCheck:
      type: object
      properties:
        check_key: { type: integer }
        business_key: { type: integer }
        vehicle_key: { type: integer }
        vehicle_id: { type: string }
        plate_number: { type: string }
        driver_key: { type: integer }
        driver_name: { type: string }
        date_key: { type: integer }
        check_datetime: { type: string, format: date-time }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        tires_ok: { type: integer, enum: [0, 1] }
        lights_ok: { type: integer, enum: [0, 1] }
        brakes_ok: { type: integer, enum: [0, 1] }
        engine_ok: { type: integer, enum: [0, 1] }
        oil_level_ok: { type: integer, enum: [0, 1] }
        coolant_ok: { type: integer, enum: [0, 1] }
        wipers_ok: { type: integer, enum: [0, 1] }
        mirrors_ok: { type: integer, enum: [0, 1] }
        seatbelts_ok: { type: integer, enum: [0, 1] }
        fire_extinguisher_ok: { type: integer, enum: [0, 1] }
        first_aid_kit_ok: { type: integer, enum: [0, 1] }
        has_damage: { type: integer, enum: [0, 1] }
        damage_description: { type: string, nullable: true }
        damage_photo_url: { type: string, nullable: true }
        check_status: { $ref: '#/components/schemas/CheckStatus' }
        mobile_device_id: { type: string, nullable: true }
    Trip:
      type: object
      properties:
        trip_key: { type: integer }
        vehicle_key: { type: integer }
        vehicle_id: { type: string }
        plate_number: { type: string }
        driver_key: { type: integer }
        driver_name: { type: string }
        route_key: { type: integer, nullable: true }
