  /sync/batch:
    post:
      tags: [Sync]
      operationId: pushSyncBatch
      summary: Push a batch of queued offline payloads (idempotent)
      description: |
        Each item is idempotent per clientRef - retrying the same batch re-acks
        instead of double-inserting (unique index on
        device+user+entityType+clientRef). Per-item statuses: QUEUED,
        DUPLICATE_ACK (already synced), ALREADY_QUEUED (still queued), or
        REJECTED (shape/entityType problem). Batch size is capped by the
        SYNC_BATCH_SIZE app config (default 50). The queue is processed
        immediately after acceptance (best-effort; cron also drains it every
        minute). Failed rows retry with jittered exponential backoff
        (base 30s x 2^retryCount, max 5 retries) then dead-letter.
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncBatchRequest' }
      responses:
        '200':
          description: Batch accepted with per-item results and a processing summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Batch received: 3 queued, 3 processed' }
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/SyncItemResult' }
                      processing: { $ref: '#/components/schemas/ProcessingSummary' }
        '400':
          description: Missing deviceId / empty items, or batch larger than SYNC_BATCH_SIZE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /sync/status:
    get:
      tags: [Sync]
      operationId: getSyncStatus
      summary: Per-device queue status
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
