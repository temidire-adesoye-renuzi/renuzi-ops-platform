          schema: { $ref: '#/components/schemas/ReceiptStatus' }
        - name: dateFrom
          in: query
          description: 'created_at >= dateFrom'
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          description: 'created_at <= dateTo'
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: GRNs (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Grn' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
