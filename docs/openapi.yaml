  /warehouse/dispatch/{dispatchKey}/warehouse-stamp:
    put:
      tags: [Warehouse]
      operationId: stampWarehouseCustody
      summary: Warehouse custody stamp (first stage of the custody chain)
      description: |
        Custody chain WAREHOUSE -> SECURITY -> DRIVER -> CUSTOMER, each stage
        requiring the previous one (409 otherwise). Every stage is idempotent
        - re-stamping acks rather than errors. The warehouse stamp moves
        PENDING dispatches to LOADED and can record per-line loaded quantities.
      x-roles: [WAREHOUSE_STAFF, WAREHOUSE_MANAGER, OPS_MANAGER, ADMIN]
      parameters:
        - name: dispatchKey
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loadedQuantities:
                  type: array
                  description: Optional per-line loaded quantity overrides
                  items:
                    type: object
                    required: [lineKey, loadedQty]
                    properties:
                      lineKey:
                        type: integer
                        description: fact_dispatch_line.dispatch_line_key
                      loadedQty: { type: integer }
      responses:
        '200':
          description: Warehouse stamp applied (status LOADED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Warehouse stamp applied' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
