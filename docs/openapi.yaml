  /pull/meta:
    get:
      tags: [Pull]
      operationId: getPullMeta
      summary: Cheap "is anything pending" probe per dataset
      x-roles: [DRIVER, FLEET_MANAGER, WAREHOUSE_MANAGER, WAREHOUSE_STAFF, OPS_MANAGER, SECURITY, ADMIN]
      parameters:
        - name: datasets
          in: query
