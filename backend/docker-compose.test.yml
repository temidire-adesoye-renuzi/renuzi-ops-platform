# ============================================================================
# TEST STACK: SQL Server 2022 + (optional) ClamAV for upload scanning tests
# Usage:
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm test
#   docker compose -f docker-compose.test.yml down -v
# ============================================================================

services:
  mssql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: renuzi-mssql-test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"   # non-default host port so local dev SQL never collides
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1' -No -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1' -No"]
      interval: 5s
      timeout: 20s
      retries: 20
      start_period: 30s

  clamav-test:
    image: clamav/clamav:latest
    container_name: renuzi-clamav-test
    ports:
      - "13310:3310"
    # Scanning is OFF unless the env points at it (VIRUS_SCAN_HOST empty in
    # test setup). This service exists so scanning-path tests CAN be run by
    # setting VIRUS_SCAN_HOST=localhost VIRUS_SCAN_PORT=13310.
    profiles: ["full"]
